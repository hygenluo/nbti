  <path d="M137 158 Q138 122 174 120 Q210 122 209 158 Q196 138 173 137 Q150 138 137 158 Z" fill="#b56a3a" stroke="#1b1b1b" stroke-width="4"/>
  <!-- droopy eyes + flat mouth -->
  <path d="M152 172 Q158 176 164 172 M182 172 Q188 176 194 172" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
  <path d="M166 190 L182 190" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
  <!-- zzz -->
  <text x="230" y="140" font-size="30" font-weight="900" fill="#1b1b1b" opacity=".5" font-family="sans-serif">z</text>
  <text x="248" y="118" font-size="24" font-weight="900" fill="#1b1b1b" opacity=".35" font-family="sans-serif">z</text>
