<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <rect width="344" height="344" x="8" y="8" rx="36" fill="#e2dae8"/>
  <circle cx="66" cy="66" r="14" fill="none" stroke="#1b1b1b" stroke-width="3" opacity=".12"/>
  <polygon points="52,280 68,280 60,296" fill="#fff" opacity=".5"/>
  <!-- boundary dashed circle at feet -->
  <ellipse cx="196" cy="300" rx="102" ry="22" fill="none" stroke="#8a7a99" stroke-width="4" stroke-dasharray="10 8" opacity=".7"/>
  <!-- person slightly transparent, shifted right of center -->
  <g opacity=".92">
    <path d="M172 250 L168 296 L182 297 L186 252 Z" fill="#6a6280" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M202 250 L208 296 L222 294 L214 252 Z" fill="#6a6280" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M164 294 L186 295 L185 304 L163 303 Z M206 292 L226 290 L227 299 L207 301 Z" fill="#1b1b1b"/>
    <path d="M160 186 L226 186 L232 254 L156 254 Z" fill="#a394b8" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
    <!-- arm holding camera up -->
    <path d="M162 194 Q138 182 138 158" fill="none" stroke="#a394b8" stroke-width="14" stroke-linecap="round"/>
    <path d="M222 194 Q240 182 242 162" fill="none" stroke="#a394b8" stroke-width="14" stroke-linecap="round"/>
    <!-- head mostly behind camera -->
    <circle cx="192" cy="140" r="35" fill="#f2d8c4" stroke="#1b1b1b" stroke-width="4"/>
    <path d="M158 134 Q156 98 192 96 Q228 98 226 134 Q214 114 192 113 Q170 114 158 134 Z" fill="#4a4258" stroke="#1b1b1b" stroke-width="4"/>
    <!-- camera covering lower face -->
    <rect x="158" y="130" width="68" height="46" rx="10" fill="#3a3a42" stroke="#1b1b1b" stroke-width="4"/>
    <circle cx="192" cy="153" r="16" fill="#20202a" stroke="#1b1b1b" stroke-width="4"/>
    <circle cx="192" cy="153" r="8" fill="#8fc1d4" stroke="#1b1b1b" stroke-width="3"/>
    <rect x="168" y="122" width="20" height="10" rx="4" fill="#3a3a42" stroke="#1b1b1b" stroke-width="3"/>
    <circle cx="216" cy="138" r="4" fill="#e05b4b"/>
    <!-- peeking eyes above camera -->
    <path d="M168 118 Q174 122 180 118 M204 118 Q210 122 216 118" fill="none" stroke="#1b1b1b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- observing marks: tiny notes floating -->
  <g transform="rotate(-8 92 190)">
    <rect x="72" y="176" width="40" height="30" rx="5" fill="#fff" stroke="#1b1b1b" stroke-width="3.5" opacity=".85"/>
    <path d="M78 186 L106 186 M78 193 L102 193 M78 200 L98 200" stroke="#1b1b1b" stroke-width="2.5" opacity=".5" stroke-linecap="round"/>
  </g>
</svg>
